    <!--
      Fraunces carries the headings: a variable serif with optical sizing, warm
      enough for a tool about how people talk and not the Playfair that turns up
      on every other page. Archivo sets everything else, including figures,
      because its tabular numerals let columns of numbers line up — which is the
      job a monospace face is usually brought in to do, at the cost of making
      every small label look like code.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
